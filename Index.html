<!doctype html>
<html lang="pt-br">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard | Pedidos ML</title>

    <style>
      :root {
        --bg: #F4F6F9; --surface: #FFFFFF; --surface2: #F8F9FB;
        --navy: #1E2D4E; --navy-light: #2C3E6B; --blue: #3B5BDB;
        --yellow: #F5C518; --yellow-light: #FFF8DC; --yellow-dark: #E0A800;
        --gray-50: #F8F9FA; --gray-100: #F1F3F5; --gray-200: #E9ECEF;
        --gray-300: #DEE2E6; --gray-400: #CED4DA; --gray-500: #ADB5BD;
        --gray-600: #6C757D; --gray-700: #495057; --gray-800: #343A40;
        --text: #1A2236; --text-muted: #6C757D;
        --badge-pending-bg: #FFF3CD; --badge-pending-text: #7D5200;
        --badge-confirm-bg: #D1FAE5; --badge-confirm-text: #065F46;
        --badge-cancel-bg:  #FFE4E4; --badge-cancel-text:  #7D0000;
        --badge-pronto-bg:  #DBEAFE; --badge-pronto-text:  #1E3A8A;
        --badge-naofin-bg:  #FEF3C7; --badge-naofin-text:  #78350F;
        --badge-outro-bg:   #F1F3F5; --badge-outro-text:   #495057;
        --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
        --shadow-md: 0 4px 12px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
        --radius: 10px; --radius2: 8px;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
        overflow-x: hidden;
      }

      .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px 48px; }

      header {
        display: flex; gap: 14px; align-items: center; justify-content: space-between;
        padding: 14px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--gray-200);
        box-shadow: var(--shadow-sm);
        position: sticky; top: 0; z-index: 10;
      }

      .brand { display: flex; gap: 12px; align-items: center; min-width: 240px; }
      .badgeLogo {
        width: 44px; height: 44px;
        background: var(--navy);
        border-left: 4px solid var(--yellow);
        border-radius: 8px;
        box-shadow: none;
      }
      .brand h1 { margin: 0; font-size: 14px; font-weight: 700; color: var(--navy); letter-spacing: 0; text-transform: none; }
      .brand .sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

      .controls { display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
      .chip {
        display: flex; gap: 10px; align-items: center;
        padding: 10px 12px;
        border-radius: var(--radius);
        border: 1px solid var(--gray-300);
        background: var(--gray-50);
        box-shadow: none;
      }
      .chip input {
        background: transparent; border: none; outline: none;
        color: var(--text);
        width: 220px;
        font-size: 13px;
      }

      .btn {
        cursor: pointer;
        border: none;
        background: var(--navy);
        color: #fff;
        padding: 10px 16px;
        border-radius: var(--radius);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0;
        text-transform: none;
        box-shadow: none;
        transition: background .15s;
      }
      .btn:hover { background: var(--navy-light); }

      .row { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 14px; }

      .sourceBar {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-radius: var(--radius);
        background: var(--surface);
        border: 1px solid var(--gray-200);
        box-shadow: var(--shadow-sm);
      }
      .sourceLeft { display: flex; flex-direction: column; gap: 4px; }
      .sourceTitle {
        font-size: 11px;
        letter-spacing: .06em;
        text-transform: uppercase;
        color: var(--text-muted);
        font-weight: 600;
      }
      .sourceHint { font-size: 12px; color: var(--text-muted); }
      .seg { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .segBtn {
        cursor: pointer;
        border-radius: 6px;
        padding: 9px 12px;
        font-size: 13px;
        letter-spacing: 0;
        text-transform: none;
        border: 1px solid var(--gray-300);
        background: var(--gray-100);
        color: var(--gray-700);
        user-select: none;
        box-shadow: none;
      }
      .segBtn.active {
        background: var(--navy);
        color: #fff;
        border-color: var(--navy);
        box-shadow: none;
      }

      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
      }

      .card {
        position: relative;
        border-radius: var(--radius);
        background: var(--surface);
        border: 1px solid var(--gray-200);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }

      .kpi { padding: 14px 14px 12px; min-height: 86px; display: flex; flex-direction: column; justify-content: space-between; }
      .kpi .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
      .kpi .value { font-size: 30px; font-weight: 700; color: var(--text); }
      .kpi .hint { font-size: 11px; color: var(--gray-500); }
      .kpi-active { border-left: 3px solid var(--yellow) !important; box-shadow: var(--shadow-md) !important; }

      .tableWrap { padding: 14px; }
      .tableHeader { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
      .tableHeader h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--navy); letter-spacing: 0; text-transform: none; }
      .meta { font-size: 12px; color: var(--text-muted); }

      table {
        width: 100%;
        border-collapse: collapse;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid var(--gray-200);
      }
      thead th {
        text-align: left;
        font-size: 12px;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: rgba(255,255,255,.9);
        background: var(--navy);
        border-bottom: 1px solid var(--navy-light);
        padding: 11px 14px;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
      }
      thead th:hover { background: var(--navy-light); }
      tbody td {
        padding: 10px 14px;
        border-bottom: 1px solid var(--gray-100);
        font-size: 13px;
        color: var(--text);
        vertical-align: middle;
        white-space: nowrap;
      }
      tbody tr { background: var(--surface); }
      tbody tr:hover { background: #EEF2FF; }
      tbody tr.row-multi { background: var(--gray-50) !important; }
      tbody tr.row-multi:hover { background: var(--gray-100) !important; }

      .badge {
        display: inline-flex;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .04em;
        text-transform: uppercase;
        border: none;
        white-space: nowrap;
      }

      .b-pendente  { background: var(--badge-pending-bg); color: var(--badge-pending-text); }
      .b-pago      { background: var(--badge-confirm-bg); color: var(--badge-confirm-text); }
      .b-entregue  { background: var(--badge-pronto-bg);  color: var(--badge-pronto-text);  }
      .b-enviado   { background: var(--badge-naofin-bg);  color: var(--badge-naofin-text);  }
      .b-cancelado { background: var(--badge-cancel-bg);  color: var(--badge-cancel-text);  }
      .b-outro     { background: var(--badge-outro-bg);   color: var(--badge-outro-text);   }

      .statusline {
        margin-top: 10px;
        font-size: 12px;
        color: var(--text-muted);
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .pill {
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid var(--gray-200);
        background: var(--gray-100);
        color: var(--gray-700);
      }
      .pill strong { color: var(--navy); }

      .toast {
        position: fixed; bottom: 24px; right: 24px; z-index: 999;
        background: #C92A2A; color: #fff; padding: 12px 18px; border-radius: 8px;
        font-size: 13px; font-weight: 500; box-shadow: 0 4px 16px rgba(0,0,0,.18);
        opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 360px;
      }
      .toast.show { opacity: 1; pointer-events: auto; }

      .loading-overlay {
        display: flex; align-items: center; justify-content: center;
        gap: 10px; padding: 48px 16px;
        color: var(--text-muted); font-size: 13px;
      }
      .spinner {
        width: 20px; height: 20px;
        border: 2px solid var(--gray-200);
        border-top-color: var(--navy);
        border-radius: 50%;
        animation: spin .7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .sort-icon { opacity: .4; font-size: 10px; margin-left: 4px; }
      th.sort-asc .sort-icon, th.sort-desc .sort-icon { opacity: 1; }
    </style>
  </head>

  <body>
    <div id="toast" class="toast" aria-live="polite"></div>

    <div class="wrap">
      <header>
        <div class="brand">
          <div class="badgeLogo"></div>
          <div>
            <h1>Pedidos — HUD Mercado Livre</h1>
            <div class="sub">Web App (Apps Script) + Google Planilhas (base de dados)</div>
          </div>
        </div>

        <div class="controls">
          <div class="chip" title="Buscar...">
            <span style="color: var(--gray-500);">⌕</span>
            <input id="q" placeholder="Buscar..." autocomplete="off" />
          </div>
          <button class="btn" id="btnReload">Atualizar</button>
        </div>
      </header>

      <div class="row">
        <section class="sourceBar">
          <div class="sourceLeft">
            <div class="sourceTitle">Fonte de dados</div>
            <div class="sourceHint" id="sourceHint">—</div>
          </div>

          <div class="seg" id="seg">
            <div class="segBtn" data-src="ML Coleta">ML Coleta</div>
            <div class="segBtn" data-src="ML 1">ML 1</div>
            <div class="segBtn" data-src="TODOS">Todos</div>
          </div>
        </section>

        <section class="kpis" id="kpis"></section>

        <section class="card tableWrap">
          <div class="tableHeader">
            <h2>Lista de pedidos</h2>
            <div class="meta" id="meta">—</div>
          </div>

          <div id="loadingOverlay" class="loading-overlay" style="display:none">
            <div class="spinner"></div><span>Carregando dados...</span>
          </div>

          <div style="width:100%; overflow:auto;">
            <table>
              <thead id="thead"></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>

          <div class="statusline" id="statusline"></div>
        </section>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);

      let ALL_PEDIDOS = [];
      let ALL_FALTAM = [];
      let KPIS = null;
      let META = null;

      let MULTI_IDS = new Set();
      let ACTIVE_SOURCE = "ML Coleta";
      let SORT = { col: null, dir: 1 };

      let ACTIVE = { type: "ALL", label: "Total", view: "STATUS" };
      const isActive = (type) => ACTIVE && ACTIVE.type === type;

      const safe = (v) => String(v ?? "")
        .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");

      const showToast = (msg, duration = 4500) => {
        const t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove("show"), duration);
      };

      const badgeClassStatus = (v) => {
        const s = (v || "").toUpperCase();
        if (s === "PENDENTE") return "b-pendente";
        if (s === "CONFIRMADO") return "b-pago";
        if (s === "CANCELADO") return "b-cancelado";
        return "b-outro";
      };
      const badgeClassBipado = (v) => {
        const s = (v || "").toUpperCase();
        if (s === "PRONTO") return "b-entregue";
        if (s === "NÃO FINALIZADO" || s === "NAO FINALIZADO") return "b-enviado";
        if (s === "CANCELADO") return "b-cancelado";
        return "b-outro";
      };
      const badgeClassEtiquetas = (v) => {
        const s = (v || "").toUpperCase();
        if (s === "IMPRESSA") return "b-pago";
        if (s === "PARA IMPRIMIR") return "b-pendente";
        if (s === "CANCELADO") return "b-cancelado";
        return "b-outro";
      };

      const kpiCards = (k) => {
        const defs = [
          { type:"ALL",               key:"total",              label:"Total",               hint:"Pedidos (IDs únicos)", view:"STATUS" },
          { type:"STATUS:PENDENTE",   key:"pendentes",          label:"Pendentes",           hint:"Pedidos pendentes", view:"STATUS" },
          { type:"FALTAM",            key:"faltam",             label:"Faltam",              hint:"Soma de Quantidade", view:"FALTAM_VIEW" },
          { type:"STATUS:CONFIRMADO", key:"confirmados",        label:"Confirmados",         hint:"Pedidos confirmados", view:"STATUS" },
          { type:"VIEW:BIPADO",       key:"bipadosPronto",      label:"Bipados",             hint:'IDs com "Pronto"', view:"BIPADO" },
          { type:"VIEW:ETIQUETAS",    key:"etiquetasImpressas", label:"Etiquetas Impressas", hint:'IDs com "Impressa"', view:"ETIQUETAS" },
          { type:"STATUS:CANCELADO",  key:"cancelados",         label:"Cancelados",          hint:"Pedidos cancelados", view:"STATUS" },
        ];

        return defs.map(d => `
          <div class="card${isActive(d.type) ? ' kpi-active' : ''}"
               role="button"
               tabindex="0"
               data-filter="${d.type}"
               data-view="${d.view}"
               style="cursor:pointer; outline:none;">
            <div class="kpi">
              <div class="label">${d.label}</div>
              <div class="value">${(k && typeof k[d.key] !== "undefined") ? k[d.key] : 0}</div>
              <div class="hint">${d.hint}</div>
            </div>
          </div>
        `).join("");
      };

      const showTodos = () => ACTIVE_SOURCE === "TODOS" && ACTIVE.view !== "FALTAM_VIEW";

      const setThead = () => {
        if (ACTIVE.view === "FALTAM_VIEW") {
          $("thead").innerHTML = `
            <tr>
              <th data-sort="produtoPendentes">Produtos Pendentes <span class="sort-icon">↕</span></th>
              <th data-sort="quantidade" style="width:140px;">Quantidade <span class="sort-icon">↕</span></th>
            </tr>
          `;
          return;
        }

        const fonteCol = showTodos()
          ? `<th data-sort="sheet" style="width:110px;">Fonte <span class="sort-icon">↕</span></th>`
          : "";

        if (ACTIVE.view === "STATUS") {
          $("thead").innerHTML = `
            <tr>
              <th data-sort="id">ID <span class="sort-icon">↕</span></th>
              <th data-sort="cliente">Cliente <span class="sort-icon">↕</span></th>
              <th data-sort="produto">Produto <span class="sort-icon">↕</span></th>
              <th data-sort="qtd" style="width:70px;">Qtd <span class="sort-icon">↕</span></th>
              <th data-sort="status" style="width:180px;">Status <span class="sort-icon">↕</span></th>
              ${fonteCol}
            </tr>
          `;
          return;
        }

        if (ACTIVE.view === "BIPADO") {
          $("thead").innerHTML = `
            <tr>
              <th data-sort="id">ID <span class="sort-icon">↕</span></th>
              <th data-sort="cliente">Cliente <span class="sort-icon">↕</span></th>
              <th data-sort="produto">Produto <span class="sort-icon">↕</span></th>
              <th data-sort="qtd" style="width:70px;">Qtd <span class="sort-icon">↕</span></th>
              <th data-sort="bipado" style="width:220px;">Bipado <span class="sort-icon">↕</span></th>
              ${fonteCol}
            </tr>
          `;
          return;
        }

        $("thead").innerHTML = `
          <tr>
            <th data-sort="id">ID <span class="sort-icon">↕</span></th>
            <th data-sort="cliente">Cliente <span class="sort-icon">↕</span></th>
            <th data-sort="produto">Produto <span class="sort-icon">↕</span></th>
            <th data-sort="qtd" style="width:70px;">Qtd <span class="sort-icon">↕</span></th>
            <th data-sort="etiquetas" style="width:220px;">Etiquetas <span class="sort-icon">↕</span></th>
            ${fonteCol}
          </tr>
        `;
      };

      const rowHtml = (p) => {
        if (ACTIVE.view === "FALTAM_VIEW") {
          return `
            <tr>
              <td>${safe(p.produtoPendentes)}</td>
              <td>${safe(p.quantidade)}</td>
            </tr>
          `;
        }

        const isMulti = MULTI_IDS.has(String(p.id));
        const trClass = isMulti ? "row-multi" : "";
        const fonteCell = showTodos()
          ? `<td><span class="badge b-outro" style="font-size:10px;">${safe(p.sheet ?? "—")}</span></td>`
          : "";

        const base = `
          <td>${safe(p.id)}</td>
          <td>${safe(p.cliente)}</td>
          <td>${safe(p.produto)}</td>
          <td>${safe(p.qtd || "—")}</td>
        `;

        if (ACTIVE.view === "STATUS") {
          return `
            <tr class="${trClass}">
              ${base}
              <td><span class="badge ${badgeClassStatus(p.status)}">${safe(p.status)}</span></td>
              ${fonteCell}
            </tr>
          `;
        }

        if (ACTIVE.view === "BIPADO") {
          return `
            <tr class="${trClass}">
              ${base}
              <td><span class="badge ${badgeClassBipado(p.bipado)}">${safe(p.bipado || "—")}</span></td>
              ${fonteCell}
            </tr>
          `;
        }

        return `
          <tr class="${trClass}">
            ${base}
            <td><span class="badge ${badgeClassEtiquetas(p.etiquetas)}">${safe(p.etiquetas || "—")}</span></td>
            ${fonteCell}
          </tr>
        `;
      };

      const emptyColspan = () => {
        if (ACTIVE.view === "FALTAM_VIEW") return 2;
        return 5 + (showTodos() ? 1 : 0);
      };

      const applySortClasses = () => {
        if (!SORT.col) return;
        $("thead").querySelectorAll("th[data-sort]").forEach(th => {
          th.classList.remove("sort-asc", "sort-desc");
          if (th.getAttribute("data-sort") === SORT.col) {
            th.classList.add(SORT.dir === 1 ? "sort-asc" : "sort-desc");
            th.querySelector(".sort-icon").textContent = SORT.dir === 1 ? "↑" : "↓";
          }
        });
      };

      const bindTheadSort = () => {
        $("thead").addEventListener("click", (e) => {
          const th = e.target.closest("th[data-sort]");
          if (!th) return;
          const col = th.getAttribute("data-sort");
          SORT.dir = (SORT.col === col) ? -SORT.dir : 1;
          SORT.col = col;
          applyAllFilters();
        }, { once: true });
      };

      const renderTable = (list) => {
        setThead();
        $("tbody").innerHTML = list.map(rowHtml).join("") || `
          <tr><td colspan="${emptyColspan()}" style="padding:16px;color:var(--text-muted)">
            Nenhum registro encontrado.
          </td></tr>
        `;
        applySortClasses();
        bindTheadSort();
      };

      const renderMeta = () => {
        if (!META) { $("meta").textContent = "—"; return; }
        const perSheet = META.perSheet ? JSON.stringify(META.perSheet).replaceAll('"','') : "";
        $("meta").textContent = `Pedidos(linhas): ${META.pedidosRows} • Faltam(itens): ${META.faltamRows} • ${perSheet}`;
      };

      const renderStatusline = (shownCount) => {
        $("statusline").innerHTML = `
          <span class="pill"><strong>Fonte:</strong> ${safe(ACTIVE_SOURCE)}</span>
          <span class="pill"><strong>Filtro:</strong> ${safe(ACTIVE.label || "Total")}</span>
          <span class="pill"><strong>Visíveis:</strong> ${shownCount}</span>
          <span class="pill"><strong>Modo:</strong> ${safe(ACTIVE.view)}</span>
        `;
      };

      const rebuildMultiIds = (listPedidosVisiveis) => {
        const counts = new Map();
        for (const p of listPedidosVisiveis) {
          const id = String(p.id);
          counts.set(id, (counts.get(id) || 0) + 1);
        }
        MULTI_IDS = new Set([...counts.entries()].filter(([,c]) => c > 1).map(([id]) => id));
      };

      const applyAllFilters = () => {
        const q = $("q").value.trim().toLowerCase();

        if (ACTIVE.view === "FALTAM_VIEW") {
          let list = [...ALL_FALTAM];

          if (q) {
            list = list.filter(it => {
              const hay = `${it.produtoPendentes} ${it.quantidade}`.toLowerCase();
              return hay.includes(q);
            });
          }

          if (SORT.col) {
            list.sort((a, b) => {
              const av = String(a[SORT.col] ?? "").toLowerCase();
              const bv = String(b[SORT.col] ?? "").toLowerCase();
              return av < bv ? -SORT.dir : av > bv ? SORT.dir : 0;
            });
          }

          renderTable(list);
          renderStatusline(list.length);
          return;
        }

        let list = [...ALL_PEDIDOS];
        const ft = ACTIVE.type || "ALL";

        if (ft.startsWith("STATUS:")) {
          const wanted = ft.split(":")[1];
          list = list.filter(p => (p.status || "").toUpperCase() === wanted);
        }

        if (q) {
          list = list.filter(p => {
            const hay = `${p.id} ${p.cliente} ${p.produto} ${p.qtd} ${p.status} ${p.bipado} ${p.etiquetas} ${p.andamento} ${p.sheet ?? ""}`.toLowerCase();
            return hay.includes(q);
          });
        }

        if (SORT.col) {
          list.sort((a, b) => {
            const av = String(a[SORT.col] ?? "").toLowerCase();
            const bv = String(b[SORT.col] ?? "").toLowerCase();
            return av < bv ? -SORT.dir : av > bv ? SORT.dir : 0;
          });
        }

        rebuildMultiIds(list);
        renderTable(list);
        renderStatusline(list.length);
      };

      const bindKpiClicks = () => {
        document.querySelectorAll("#kpis [data-filter]").forEach(el => {
          el.addEventListener("click", () => {
            const type = el.getAttribute("data-filter") || "ALL";
            const view = el.getAttribute("data-view") || "STATUS";

            const labelMap = {
              "ALL": "Total",
              "STATUS:PENDENTE": "Pendentes",
              "FALTAM": "Faltam",
              "STATUS:CONFIRMADO": "Confirmados",
              "VIEW:BIPADO": "Bipados",
              "VIEW:ETIQUETAS": "Etiquetas Impressas",
              "STATUS:CANCELADO": "Cancelados",
            };

            ACTIVE = { type, label: labelMap[type] || "Total", view };
            SORT = { col: null, dir: 1 };

            $("kpis").innerHTML = kpiCards(KPIS);
            bindKpiClicks();
            applyAllFilters();
          });
        });
      };

      const updateSourceUI = () => {
        document.querySelectorAll("#seg .segBtn").forEach(b => {
          b.classList.toggle("active", (b.getAttribute("data-src") || "") === ACTIVE_SOURCE);
        });

        const hint = (ACTIVE_SOURCE === "TODOS")
          ? "Mesclando ML Coleta + ML 1"
          : `Usando apenas: ${ACTIVE_SOURCE}`;

        $("sourceHint").textContent = hint;
      };

      const bindSourceSelector = () => {
        document.querySelectorAll("#seg .segBtn").forEach(b => {
          b.addEventListener("click", () => {
            ACTIVE_SOURCE = b.getAttribute("data-src") || "ML Coleta";
            SORT = { col: null, dir: 1 };
            updateSourceUI();

            ACTIVE = { type: "ALL", label: "Total", view: "STATUS" };
            $("q").value = "";

            fetchPedidos();
          });
        });
      };

      const fetchPedidos = () => {
        $("loadingOverlay").style.display = "flex";
        $("tbody").innerHTML = "";
        $("thead").innerHTML = "";

        google.script.run
          .withSuccessHandler((res) => {
            $("loadingOverlay").style.display = "none";

            if (!res || !res.ok) throw new Error((res && res.error) || "Erro desconhecido.");

            ALL_PEDIDOS = res.pedidos || [];
            ALL_FALTAM = res.faltamItems || [];
            KPIS = res.kpis || null;
            META = res.meta || null;

            $("kpis").innerHTML = kpiCards(KPIS);
            bindKpiClicks();

            renderMeta();
            applyAllFilters();
          })
          .withFailureHandler((err) => {
            $("loadingOverlay").style.display = "none";
            showToast("Falha ao carregar: " + (err?.message ?? err));
          })
          .getPedidos(ACTIVE_SOURCE);
      };

      $("q").addEventListener("input", () => {
        window.clearTimeout(window.__t);
        window.__t = window.setTimeout(applyAllFilters, 80);
      });

      $("btnReload").addEventListener("click", fetchPedidos);

      // Boot
      bindSourceSelector();
      updateSourceUI();
      fetchPedidos();
    </script>
  </body>
</html>
