<!doctype html>
<html lang="pt-br">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard | Pedidos ML</title>

    <style>
      /* (mantive seu CSS inteiro — igual ao que você já tem) */
      :root{
        --bg: #000000;
        --panel: rgba(10, 10, 14, .72);
        --panel2: rgba(14, 14, 20, .62);
        --text: rgba(255,255,255,.92);
        --muted: rgba(255,255,255,.62);

        --ml-yellow: #ffe600;
        --cyan: #00f6ff;
        --magenta: #ff2bd6;
        --green: #38ff8b;
        --red: #ff3b3b;
        --orange:#ff9f1a;

        --glow-yellow: 0 0 14px rgba(255,230,0,.45), 0 0 36px rgba(255,230,0,.18);
        --glow-cyan:   0 0 14px rgba(0,246,255,.42), 0 0 34px rgba(0,246,255,.16);
        --glow-mag:    0 0 14px rgba(255,43,214,.35), 0 0 34px rgba(255,43,214,.14);

        --radius: 16px;
        --radius2: 22px;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body{
        margin:0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
        overflow-x:hidden;
      }

      .bgfx{
        position: fixed; inset: 0; pointer-events:none;
        background:
          radial-gradient(1200px 800px at 15% 20%, rgba(0,246,255,.08), transparent 55%),
          radial-gradient(900px 700px at 85% 25%, rgba(255,43,214,.07), transparent 55%),
          radial-gradient(900px 900px at 50% 90%, rgba(255,230,0,.08), transparent 60%),
          linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
        background-size: auto, auto, auto, 46px 46px, 46px 46px;
        mix-blend-mode: screen;
        opacity: .9;
      }
      .scanlines{
        position: fixed; inset:0; pointer-events:none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.02),
          rgba(255,255,255,.02) 1px,
          transparent 1px,
          transparent 4px
        );
        opacity:.20;
      }

      .wrap{ max-width: 1200px; margin: 0 auto; padding: 18px 14px 40px; }

      header{
        display:flex; gap:14px; align-items:center; justify-content:space-between;
        padding: 14px 14px;
        border-radius: var(--radius2);
        background: linear-gradient(180deg, rgba(18,18,24,.75), rgba(10,10,14,.55));
        border: 1px solid rgba(255,230,0,.18);
        box-shadow: 0 18px 60px rgba(0,0,0,.55), var(--glow-yellow);
        position: sticky; top: 10px; z-index: 10;
        backdrop-filter: blur(10px);
      }

      .brand{ display:flex; gap:12px; align-items:center; min-width:240px; }
      .badgeLogo{
        width:44px;height:44px;border-radius:14px;position:relative;overflow:hidden;
        background:
          radial-gradient(circle at 30% 30%, rgba(255,230,0,.95), rgba(255,230,0,.45) 40%, rgba(0,0,0,0) 70%),
          radial-gradient(circle at 70% 70%, rgba(0,246,255,.55), rgba(0,0,0,0) 55%),
          linear-gradient(135deg, rgba(255,43,214,.22), rgba(0,0,0,0));
        box-shadow: var(--glow-yellow), var(--glow-cyan);
        border: 1px solid rgba(255,230,0,.25);
      }
      .brand h1{ margin:0; font-size:14px; letter-spacing:.12em; text-transform:uppercase; }
      .brand .sub{ font-size:12px; color: var(--muted); margin-top:4px; }

      .controls{ display:flex; gap:10px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
      .chip{
        display:flex; gap:10px; align-items:center;
        padding: 10px 12px;
        border-radius: 999px;
        border: 1px solid rgba(0,246,255,.18);
        background: rgba(10,10,14,.55);
        box-shadow: 0 12px 30px rgba(0,0,0,.35), var(--glow-cyan);
      }
      .chip input{
        background: transparent; border:none; outline:none;
        color: var(--text);
        width: 220px;
        font-size: 13px;
      }

      .btn{
        cursor:pointer;
        border: 1px solid rgba(255,230,0,.24);
        background: linear-gradient(180deg, rgba(255,230,0,.14), rgba(255,230,0,.06));
        color: rgba(255,255,255,.92);
        padding: 10px 12px;
        border-radius: 999px;
        letter-spacing:.08em;
        text-transform: uppercase;
        font-size: 12px;
        box-shadow: 0 14px 30px rgba(0,0,0,.4), var(--glow-yellow);
      }

      .row{ display:grid; grid-template-columns: 1fr; gap: 14px; margin-top: 14px; }

      .sourceBar{
        display:flex; align-items:center; justify-content:space-between;
        gap: 12px;
        padding: 10px 12px;
        border-radius: var(--radius);
        background: rgba(10,10,14,.50);
        border: 1px solid rgba(255,255,255,.08);
        box-shadow: 0 18px 60px rgba(0,0,0,.45);
      }
      .sourceLeft{ display:flex; flex-direction:column; gap:4px; }
      .sourceTitle{
        font-size: 11px;
        letter-spacing:.16em;
        text-transform: uppercase;
        color: rgba(255,255,255,.78);
      }
      .sourceHint{ font-size: 12px; color: rgba(255,255,255,.55); }
      .seg{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
      .segBtn{
        cursor:pointer;
        border-radius: 999px;
        padding: 9px 12px;
        font-size: 12px;
        letter-spacing:.10em;
        text-transform: uppercase;
        border: 1px solid rgba(255,255,255,.10);
        background: rgba(0,0,0,.30);
        color: rgba(255,255,255,.86);
        user-select:none;
      }
      .segBtn.active{
        border-color: rgba(255,230,0,.25);
        box-shadow: var(--glow-yellow);
        background: rgba(255,230,0,.08);
      }

      .kpis{
        display:grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 12px;
      }

      .card{
        position: relative;
        border-radius: var(--radius);
        background: linear-gradient(180deg, rgba(10,10,14,.72), rgba(14,14,20,.62));
        border: 1px solid rgba(255,255,255,.08);
        box-shadow: 0 20px 60px rgba(0,0,0,.55);
        overflow: hidden;
      }

      .kpi{ padding: 14px 14px 12px; min-height: 86px; display:flex; flex-direction:column; justify-content:space-between; }
      .kpi .label{ font-size: 12px; letter-spacing:.12em; text-transform:uppercase; color: rgba(255,255,255,.75); }
      .kpi .value{ font-size: 26px; font-weight: 800; }
      .kpi .hint{ font-size: 12px; color: rgba(255,255,255,.6); }

      .tableWrap{ padding: 14px; }
      .tableHeader{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom: 12px; }
      .tableHeader h2{ margin:0; font-size: 12px; letter-spacing:.16em; text-transform:uppercase; color: rgba(255,255,255,.84); }
      .meta{ font-size: 12px; color: rgba(255,255,255,.55); }

      table{
        width:100%;
        border-collapse: collapse;
        border-radius: 14px;
        overflow:hidden;
        border: 1px solid rgba(255,230,0,.12);
      }
      thead th{
        text-align:left;
        font-size: 12px;
        letter-spacing:.14em;
        text-transform: uppercase;
        color: rgba(255,255,255,.78);
        background: rgba(255,230,0,.08);
        border-bottom: 1px solid rgba(255,230,0,.14);
        padding: 12px 12px;
        white-space: nowrap;
      }
      tbody td{
        padding: 12px 12px;
        border-bottom: 1px solid rgba(255,255,255,.06);
        font-size: 13px;
        color: rgba(255,255,255,.88);
        vertical-align: middle;
        white-space: nowrap;
      }
      tbody tr{
        background: rgba(10,10,14,.35);
      }
      tbody tr:hover{
        background: rgba(0,246,255,.06);
      }

      /* multi-item cinza (para pedidos) */
      tbody tr.row-multi{
        background: rgba(255,255,255,.06) !important;
      }
      tbody tr.row-multi:hover{
        background: rgba(255,255,255,.10) !important;
      }

      .badge{
        display:inline-flex; align-items:center; gap:8px;
        padding: 7px 10px;
        border-radius: 999px;
        font-size: 12px;
        letter-spacing:.10em;
        text-transform: uppercase;
        border: 1px solid rgba(255,255,255,.10);
        background: rgba(0,0,0,.35);
        white-space: nowrap;
      }
      .dot{
        width: 8px; height: 8px; border-radius: 999px;
        background: rgba(255,255,255,.35);
      }

      .b-pendente{ border-color: rgba(255,230,0,.28); }
      .b-pendente .dot{ background: var(--ml-yellow); }
      .b-pago{ border-color: rgba(0,246,255,.28); }
      .b-pago .dot{ background: var(--cyan); }
      .b-enviado{ border-color: rgba(255,43,214,.26); }
      .b-enviado .dot{ background: var(--magenta); }
      .b-entregue{ border-color: rgba(56,255,139,.22); }
      .b-entregue .dot{ background: var(--green); }
      .b-cancelado{ border-color: rgba(255,59,59,.22); }
      .b-cancelado .dot{ background: var(--red); }
      .b-outro{ border-color: rgba(255,159,26,.22); }
      .b-outro .dot{ background: var(--orange); }

      .statusline{
        margin-top: 10px;
        font-size: 12px;
        color: rgba(255,255,255,.58);
        display:flex;
        gap:12px;
        flex-wrap: wrap;
      }
      .pill{
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,.10);
        background: rgba(10,10,14,.45);
      }
      .pill strong{ color: rgba(255,255,255,.85); font-weight: 700; }
    </style>
  </head>

  <body>
    <div class="bgfx"></div>
    <div class="scanlines"></div>

    <div class="wrap">
      <header>
        <div class="brand">
          <div class="badgeLogo"></div>
          <div>
            <h1>Pedidos — HUD Mercado Livre</h1>
            <div class="sub">Web App (Apps Script) + Google Planilhas (base de dados)</div>
          </div>
        </div>

        <div class="controls">
          <div class="chip" title="Buscar...">
            <span style="color:rgba(0,246,255,.85);">⌕</span>
            <input id="q" placeholder="Buscar..." autocomplete="off" />
          </div>
          <button class="btn" id="btnReload">Atualizar</button>
        </div>
      </header>

      <div class="row">
        <section class="sourceBar">
          <div class="sourceLeft">
            <div class="sourceTitle">Fonte de dados</div>
            <div class="sourceHint" id="sourceHint">—</div>
          </div>

          <div class="seg" id="seg">
            <div class="segBtn" data-src="ML Coleta">ML Coleta</div>
            <div class="segBtn" data-src="ML 1">ML 1</div>
            <div class="segBtn" data-src="TODOS">Todos</div>
          </div>
        </section>

        <section class="kpis" id="kpis"></section>

        <section class="card tableWrap">
          <div class="tableHeader">
            <h2>Lista de pedidos</h2>
            <div class="meta" id="meta">—</div>
          </div>

          <div style="width:100%; overflow:auto;">
            <table>
              <thead id="thead"></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>

          <div class="statusline" id="statusline"></div>
        </section>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);

      let ALL_PEDIDOS = [];
      let ALL_FALTAM = [];
      let KPIS = null;
      let META = null;

      // IDs repetidos (multi-item) só para pedidos
      let MULTI_IDS = new Set();

      let ACTIVE_SOURCE = "ML Coleta";

      // view: STATUS | BIPADO | ETIQUETAS | FALTAM_VIEW
      let ACTIVE = { type: "ALL", label: "Total", view: "STATUS" };
      const isActive = (type) => ACTIVE && ACTIVE.type === type;

      const safe = (v) => String(v ?? "")
        .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");

      const badgeClassStatus = (v) => {
        const s = (v || "").toUpperCase();
        if (s === "PENDENTE") return "b-pendente";
        if (s === "CONFIRMADO") return "b-pago";
        if (s === "CANCELADO") return "b-cancelado";
        return "b-outro";
      };
      const badgeClassBipado = (v) => {
        const s = (v || "").toUpperCase();
        if (s === "PRONTO") return "b-entregue";
        if (s === "NÃO FINALIZADO" || s === "NAO FINALIZADO") return "b-enviado";
        if (s === "CANCELADO") return "b-cancelado";
        return "b-outro";
      };
      const badgeClassEtiquetas = (v) => {
        const s = (v || "").toUpperCase();
        if (s === "IMPRESSA") return "b-pago";
        if (s === "PARA IMPRIMIR") return "b-pendente";
        if (s === "CANCELADO") return "b-cancelado";
        return "b-outro";
      };

      const kpiCards = (k) => {
        const defs = [
          { type:"ALL",               key:"total",              label:"Total",               hint:"Pedidos (IDs únicos)", view:"STATUS" },
          { type:"STATUS:PENDENTE",   key:"pendentes",          label:"Pendentes",           hint:"Pedidos pendentes", view:"STATUS" },
          { type:"FALTAM",            key:"faltam",             label:"Faltam",              hint:"Soma de Quantidade", view:"FALTAM_VIEW" },
          { type:"STATUS:CONFIRMADO", key:"confirmados",        label:"Confirmados",         hint:"Pedidos confirmados", view:"STATUS" },
          { type:"VIEW:BIPADO",       key:"bipadosPronto",      label:"Bipados",             hint:'IDs com "Pronto"', view:"BIPADO" },
          { type:"VIEW:ETIQUETAS",    key:"etiquetasImpressas", label:"Etiquetas Impressas", hint:'IDs com "Impressa"', view:"ETIQUETAS" },
          { type:"STATUS:CANCELADO",  key:"cancelados",         label:"Cancelados",          hint:"Pedidos cancelados", view:"STATUS" },
        ];

        return defs.map(d => `
          <div class="card"
               role="button"
               tabindex="0"
               data-filter="${d.type}"
               data-view="${d.view}"
               style="cursor:pointer; outline:none; ${isActive(d.type) ? 'filter: brightness(1.10);' : ''}">
            <div class="kpi">
              <div class="label">${d.label}</div>
              <div class="value">${(k && typeof k[d.key] !== "undefined") ? k[d.key] : 0}</div>
              <div class="hint">${d.hint}</div>
            </div>
          </div>
        `).join("");
      };

      const setThead = () => {
        if (ACTIVE.view === "FALTAM_VIEW") {
          $("thead").innerHTML = `
            <tr>
              <th>Produtos Pendentes</th>
              <th style="width:140px;">Quantidade</th>
            </tr>
          `;
          return;
        }

        if (ACTIVE.view === "STATUS") {
          $("thead").innerHTML = `
            <tr>
              <th>ID</th><th>Cliente</th><th>Produto</th><th style="width:70px;">Qtd</th><th style="width:180px;">Status</th>
            </tr>
          `;
          return;
        }

        if (ACTIVE.view === "BIPADO") {
          $("thead").innerHTML = `
            <tr>
              <th>ID</th><th>Cliente</th><th>Produto</th><th style="width:70px;">Qtd</th><th style="width:220px;">Bipado</th>
            </tr>
          `;
          return;
        }

        $("thead").innerHTML = `
          <tr>
            <th>ID</th><th>Cliente</th><th>Produto</th><th style="width:70px;">Qtd</th><th style="width:220px;">Etiquetas</th>
          </tr>
        `;
      };

      const rowHtml = (p) => {
        // FALTAM VIEW usa dataset independente (não tem id/cliente)
        if (ACTIVE.view === "FALTAM_VIEW") {
          return `
            <tr>
              <td>${safe(p.produtoPendentes)}</td>
              <td>${safe(p.quantidade)}</td>
            </tr>
          `;
        }

        // Outros views usam pedidos (podem ter cinza multi-item)
        const isMulti = MULTI_IDS.has(String(p.id));
        const trClass = isMulti ? "row-multi" : "";

        const base = `
          <td>${safe(p.id)}</td>
          <td>${safe(p.cliente)}</td>
          <td>${safe(p.produto)}</td>
          <td>${safe(p.qtd || "—")}</td>
        `;

        if (ACTIVE.view === "STATUS") {
          return `
            <tr class="${trClass}">
              ${base}
              <td><span class="badge ${badgeClassStatus(p.status)}"><span class="dot"></span>${safe(p.status)}</span></td>
            </tr>
          `;
        }

        if (ACTIVE.view === "BIPADO") {
          return `
            <tr class="${trClass}">
              ${base}
              <td><span class="badge ${badgeClassBipado(p.bipado)}"><span class="dot"></span>${safe(p.bipado || "—")}</span></td>
            </tr>
          `;
        }

        return `
          <tr class="${trClass}">
            ${base}
            <td><span class="badge ${badgeClassEtiquetas(p.etiquetas)}"><span class="dot"></span>${safe(p.etiquetas || "—")}</span></td>
          </tr>
        `;
      };

      const emptyColspan = () => (ACTIVE.view === "FALTAM_VIEW" ? 2 : 5);

      const renderTable = (list) => {
        setThead();
        $("tbody").innerHTML = list.map(rowHtml).join("") || `
          <tr><td colspan="${emptyColspan()}" style="padding:16px;color:rgba(255,255,255,.65)">
            Nenhum registro encontrado.
          </td></tr>
        `;
      };

      const renderMeta = () => {
        if (!META) { $("meta").textContent = "—"; return; }
        const perSheet = META.perSheet ? JSON.stringify(META.perSheet).replaceAll('"','') : "";
        $("meta").textContent = `Pedidos(linhas): ${META.pedidosRows} • Faltam(itens): ${META.faltamRows} • ${perSheet}`;
      };

      const renderStatusline = (shownCount) => {
        $("statusline").innerHTML = `
          <span class="pill"><strong>Fonte:</strong> ${safe(ACTIVE_SOURCE)}</span>
          <span class="pill"><strong>Filtro:</strong> ${safe(ACTIVE.label || "Total")}</span>
          <span class="pill"><strong>Visíveis:</strong> ${shownCount}</span>
          <span class="pill"><strong>Modo:</strong> ${safe(ACTIVE.view)}</span>
        `;
      };

      const rebuildMultiIds = (listPedidosVisiveis) => {
        const counts = new Map();
        for (const p of listPedidosVisiveis) {
          const id = String(p.id);
          counts.set(id, (counts.get(id) || 0) + 1);
        }
        MULTI_IDS = new Set([...counts.entries()].filter(([,c]) => c > 1).map(([id]) => id));
      };

      const applyAllFilters = () => {
        const q = $("q").value.trim().toLowerCase();

        // ===== FALTAM VIEW: filtra em ALL_FALTAM =====
        if (ACTIVE.view === "FALTAM_VIEW") {
          let list = [...ALL_FALTAM];

          if (q) {
            list = list.filter(it => {
              const hay = `${it.produtoPendentes} ${it.quantidade}`.toLowerCase();
              return hay.includes(q);
            });
          }

          renderTable(list);
          renderStatusline(list.length);
          return;
        }

        // ===== OUTROS VIEWS: filtra em ALL_PEDIDOS =====
        let list = [...ALL_PEDIDOS];
        const ft = ACTIVE.type || "ALL";

        if (ft.startsWith("STATUS:")) {
          const wanted = ft.split(":")[1];
          list = list.filter(p => (p.status || "").toUpperCase() === wanted);
        }

        // VIEW:BIPADO e VIEW:ETIQUETAS não filtram (só mudam colunas)

        if (q) {
          list = list.filter(p => {
            const hay = `${p.id} ${p.cliente} ${p.produto} ${p.qtd} ${p.status} ${p.bipado} ${p.etiquetas} ${p.andamento}`.toLowerCase();
            return hay.includes(q);
          });
        }

        rebuildMultiIds(list);
        renderTable(list);
        renderStatusline(list.length);
      };

      const bindKpiClicks = () => {
        document.querySelectorAll("#kpis [data-filter]").forEach(el => {
          el.addEventListener("click", () => {
            const type = el.getAttribute("data-filter") || "ALL";
            const view = el.getAttribute("data-view") || "STATUS";

            const labelMap = {
              "ALL": "Total",
              "STATUS:PENDENTE": "Pendentes",
              "FALTAM": "Faltam",
              "STATUS:CONFIRMADO": "Confirmados",
              "VIEW:BIPADO": "Bipados",
              "VIEW:ETIQUETAS": "Etiquetas Impressas",
              "STATUS:CANCELADO": "Cancelados",
            };

            ACTIVE = { type, label: labelMap[type] || "Total", view };

            $("kpis").innerHTML = kpiCards(KPIS);
            bindKpiClicks();
            applyAllFilters();
          });
        });
      };

      const updateSourceUI = () => {
        document.querySelectorAll("#seg .segBtn").forEach(b => {
          b.classList.toggle("active", (b.getAttribute("data-src") || "") === ACTIVE_SOURCE);
        });

        const hint = (ACTIVE_SOURCE === "TODOS")
          ? "Mesclando ML Coleta + ML 1"
          : `Usando apenas: ${ACTIVE_SOURCE}`;

        $("sourceHint").textContent = hint;
      };

      const bindSourceSelector = () => {
        document.querySelectorAll("#seg .segBtn").forEach(b => {
          b.addEventListener("click", () => {
            ACTIVE_SOURCE = b.getAttribute("data-src") || "ML Coleta";
            updateSourceUI();

            ACTIVE = { type: "ALL", label: "Total", view: "STATUS" };
            $("q").value = "";

            fetchPedidos();
          });
        });
      };

      const fetchPedidos = () => {
        google.script.run
          .withSuccessHandler((res) => {
            if (!res || !res.ok) throw new Error((res && res.error) || "Erro desconhecido.");

            ALL_PEDIDOS = res.pedidos || [];
            ALL_FALTAM = res.faltamItems || [];
            KPIS = res.kpis || null;
            META = res.meta || null;

            $("kpis").innerHTML = kpiCards(KPIS);
            bindKpiClicks();

            renderMeta();
            applyAllFilters();
          })
          .withFailureHandler((err) => alert("Falha ao carregar: " + (err && err.message ? err.message : err)))
          .getPedidos(ACTIVE_SOURCE);
      };

      $("q").addEventListener("input", () => {
        window.clearTimeout(window.__t);
        window.__t = window.setTimeout(applyAllFilters, 80);
      });

      $("btnReload").addEventListener("click", fetchPedidos);

      // Boot
      bindSourceSelector();
      updateSourceUI();
      fetchPedidos();
    </script>
  </body>
</html>
